<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">mi-lsp focused repository search workflow</title>
  <desc id="desc">An illustrative terminal demo showing repository initialization, a search for billing retry with matching code, and a multi-read command for two exact file ranges.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#17213a"/>
    </linearGradient>
    <style>
      .bg{fill:url(#bg)}.panel{fill:#0f172a;stroke:#334155;stroke-width:1.4}.bar{fill:#1e293b}
      .text{fill:#e5eefb;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.muted{fill:#94a3b8;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
      .mono{fill:#dbeafe;font-family:Consolas,"Liberation Mono",monospace}.ok{fill:#7dd3fc;font-family:Consolas,"Liberation Mono",monospace}
      .accent{fill:#2dd4bf}.title{font-size:44px;font-weight:800}.body{font-size:23px}.small{font-size:20px}.cmd{font-size:20px}
    </style>
  </defs>
  <rect class="bg" width="1200" height="620" rx="34"/>
  <text x="60" y="76" class="text title">Find the code. Read only what matters.</text>
  <text x="60" y="116" class="muted body">One local workflow from repository setup to focused file ranges.</text>

  <rect x="60" y="154" width="1080" height="392" rx="22" class="panel"/>
  <rect x="60" y="154" width="1080" height="52" rx="22" class="bar"/>
  <circle cx="92" cy="180" r="8" fill="#fb7185"/><circle cx="118" cy="180" r="8" fill="#fbbf24"/><circle cx="144" cy="180" r="8" fill="#34d399"/>
  <text x="176" y="187" class="muted small">mi-lsp focused search</text>

  <text x="88" y="246" class="mono cmd">$ mi-lsp init . --name myapp</text>
  <text x="88" y="278" class="ok cmd">workspace registered · index ready or job_id returned</text>

  <text x="88" y="332" class="mono cmd">$ mi-lsp nav search "billing retry" --include-content &#92;</text>
  <text x="112" y="364" class="mono cmd">  --workspace myapp --format toon</text>
  <text x="88" y="396" class="ok cmd">illustrative result · implementation and test</text>

  <text x="88" y="450" class="mono cmd">$ mi-lsp nav multi-read src/billing/retry.go:20-80 &#92;</text>
  <text x="112" y="482" class="mono cmd">  tests/billing/retry_test.go:10-55 --workspace myapp --format toon</text>
  <text x="88" y="514" class="ok cmd">exact ranges returned · no whole-file dump</text>

  <circle cx="84" cy="582" r="6" class="accent"/>
  <text x="104" y="590" class="muted small">Local index · direct reads · optional semantic enrichment</text>
</svg>
