interface:
  display_name: "mi-lsp"
  short_description: "Semantic CLI for code and .docs/wiki canon"
  default_prompt: "Use $mi-lsp first. The CLI is the authority; mi-lsp mcp and integrations/ host doors are optional. For every supported goal-shaped request start with nav intent; routing is automatic with no opt-out. Use workspace which for the resolved workspace and executable, and nav suggest only as a bounded hint of an existing nav command. Preserve bounded preview sections, candidates, fallbacks, omissions, and exact expansions[].command/reason. Global --max-chars caps output; 0 means unset. Never fall back on timeout, silence, DONE, or PASS without fresh evidence; use external fallback only for a visible reason_code of unsupported_operation, unavailable_binary, invalid_workspace, or explicit_incomplete plus a separate detail. MI_LSP_BIN, when set, must point at the real executable, not a .cmd shim. Keep evidence redacted and do not invent model/provider metadata."
