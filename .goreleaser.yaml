version: 2

project_name: mi-lsp

env:
  - CGO_ENABLED=0

before:
  hooks:
    - sh ./scripts/release/windows-resources.sh {{ .Version }}
    - go run ./scripts/release/metadata -version {{ .Version }} -commit {{ .FullCommit }} -build-time {{ .Date }}
    - pwsh -NoProfile -File ./scripts/release/build-workers.ps1 -OutDir ./.goreleaser/workers -Clean

builds:
  - id: cli
    binary: mi-lsp
    main: ./cmd/mi-lsp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -buildvcs=true
    ldflags:
      - -s -w -X github.com/fgpaz/mi-lsp/internal/model.BuildVersion={{ .Version }} -X github.com/fgpaz/mi-lsp/internal/model.BuildRevision={{ .FullCommit }} -X github.com/fgpaz/mi-lsp/internal/model.BuildTime={{ .Date }}

  - id: host
    binary: mi-lsp-host
    main: ./cmd/mi-lsp-host
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath, -buildvcs=true]
    ldflags:
      - -s -w -H=windowsgui -X github.com/fgpaz/mi-lsp/internal/model.BuildVersion={{ .Version }} -X github.com/fgpaz/mi-lsp/internal/model.BuildRevision={{ .FullCommit }} -X github.com/fgpaz/mi-lsp/internal/model.BuildTime={{ .Date }}

archives:
  - id: host-binaries
    ids: [host]
    formats: [binary]
    # GoReleaser 2.13.1 appends binary.Ext() for binary archives.
    name_template: 'mi-lsp-host_{{ .Version }}_win-{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}'
  - id: bundled
    ids:
      - cli
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ if eq .Os "windows" }}win{{ else }}{{ .Os }}{{ end }}-{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - src: ".goreleaser/metadata/*.json"
        dst: integrations/mi-mcp
      - src: .docs/wiki/07_technical/contracts/CT-Q-V1.md
        dst: .docs/wiki/07_technical/contracts
      - src: TROUBLESHOOTING.md
        dst: docs
      - src: "scripts/install/*"
        dst: scripts/install
      # All platform workers are bundled in every archive; the runtime selects
      # workers/<rid> by ResolveRID(). (GoReleaser v2 does not template files.src/dst,
      # so per-platform pruning is not done here.)
      - src: ".goreleaser/workers/**/*"
        dst: workers

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} v{{ .Version }}"
