name: Tests

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        go-version:
          - "1.24.4"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Harness-first RSS dependency
        run: python -m pip install --requirement scripts/bench/harness_first/requirements.txt

      - name: Validate Harness-first runner tests
        run: python -m unittest discover -s scripts/bench/harness_first/tests -p "test_*.py"

      - name: Validate Harness-first campaign schema (dry-run)
        run: python -m scripts.bench.harness_first.runner --manifest docs/benchmarks/HARNESS_FIRST_CAMPAIGN.json --output .artifacts/harness-first-dry-run --dry-run

      - name: Test shell installer platform mappings
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        run: sh scripts/tests/install-platform-mapping.sh

      - name: Test release platform mapping and offline archive guards
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        env:
          MI_LSP_ALLOW_NO_PWSH: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
        run: sh scripts/tests/release-platform-mapping.sh

      - name: Test PowerShell archive guards
        if: matrix.os == 'windows-latest' || matrix.os == 'macos-latest'
        shell: pwsh
        run: ./scripts/tests/archive-safety.ps1

      - name: Run Go tests with race detector
        if: runner.arch != 'ARM64'
        run: go test -v -race ./...

      - name: Record unsupported Windows ARM64 race gate
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: Write-Output "NOT_RUN_HOST_UNSUPPORTED"

      - name: Run go vet
        run: go vet ./...

      - name: Build worker
        run: dotnet build worker-dotnet/MiLsp.Worker.sln -c Release

      - name: Run Roslyn worker contract tests from repository root
        working-directory: .
        run: dotnet run --project worker-dotnet/MiLsp.Worker.ContractTests/MiLsp.Worker.ContractTests.csproj -c Release
