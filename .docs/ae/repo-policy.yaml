last_updated: "2026-07-24"
schema: "ae-repo-policy/v1"
version: 1
required: []

authority:
  schema: "ae-authority/v1"
  version: 1
  model:
    - Kernel
    - Team
    - Repository
    - Person
    - Session
  kernel:
    id: ae-kernel
  team:
    id: local-team
  repository:
    id: mi-lsp
  person:
    id: local-person
  session:
    id: ae-kernel-v2-only
  allowlist:
    version: v1
    paths:
      - CLAUDE.md
      - AGENTS.md
      - .docs/ae/repo-policy.yaml
      - .docs/raw/repo-policy.yaml

repo:
  name: mi-lsp
  description: Local semantic CLI for large .NET/C# and TypeScript workspaces.
  structure_rules:
    - "Go CLI and daemon code lives under cmd/ and internal/."
    - "The Roslyn worker lives under worker-dotnet/."
    - ".docs/wiki is the canonical repository documentation authority."
    - ".docs/auditoria/<session>/ stores durable sanitized evidence."
    - ".docs/raw/ remains non-canonical local input."

language:
  policy_lang: English
  docs_lang: Spanish
  ux_orthography_rules:
    - "Preserve Spanish orthography and diacritics in documentation."

tracker:
  provider: Linear
  linear:
    base_url: https://api.linear.app/graphql
    key_env: LINEAR_API_KEY
    workspace: TES
    projects:
      - key: TES
        name: mi-lsp
        scope: features, bugs, operations

secrets:
  vault: environment
  tool: environment variables

wrappers:
  - name: mi-lsp
    script: mi-lsp
    precondition: "Set MI_LSP_CLIENT_NAME and MI_LSP_SESSION_ID before governed navigation."
    authority: repository policy

wiki:
  layers_map:
    "01": Scope
    "02": Architecture
    "03": Functional flows
    "04": Functional requirements
    "05": Data model
    "06": Test matrix and test plans
    "07": Technical baseline
    "08": Physical data model
    "09": Technical contracts
    "ae": Compatibility history only; universal AE authority is the external Kernel v2 canon
  paths_file: PATHS.md
  subagents_file: AGENTS.md
  workspace_alias: mi-lsp
  decision_priority:
    functional_behavior:
      - RF
      - FL
      - data model
      - architecture
    data_state_contract:
      - data model
      - RF
      - FL
      - architecture
    operational_perf_infra:
      - architecture
      - FL
      - RF
      - data model

qa:
  canon_paths:
    - .docs/wiki/06_matriz_pruebas_RF.md
    - .docs/wiki/06_pruebas/

subagents:
  max_model: sonnet
  roster_file: AGENTS.md
  routing_notes:
    - "Use manifest-backed ae-adapter-* workers for governed T2+ work."
    - "Use read-only explorers for independent discovery axes."
