last_updated: "2026-08-25"
schema: "ae-repo-policy/v1"
version: 1
required: []

authority:
  schema: "ae-authority/v1"
  version: 1
  model:
    - Kernel
    - Team
    - Repository
    - Person
    - Session
  kernel:
    id: ae-kernel
  team:
    id: local-team
  repository:
    id: mi-lsp
  person:
    id: local-person
  session:
    id: ae-kernel-v2-only
  allowlist:
    version: v1
    paths:
      - CLAUDE.md
      - AGENTS.md
      - .docs/ae/repo-policy.yaml

repo:
  kind: product
  name: mi-lsp
  description: Local semantic CLI for large .NET/C# and TypeScript workspaces.
  structure_rules:
    - "Go CLI and daemon code lives under cmd/ and internal/."
    - "The Roslyn worker lives under worker-dotnet/."
    - ".docs/wiki is the canonical repository documentation authority."
    - ".docs/auditoria/<session>/ stores durable sanitized evidence."
    - ".docs/raw/ remains non-canonical local input."
    - "Web tasks use mi-browser (via mi-mcp/CLI) before Claude in Chrome, which stays off by default; on a login wall, try other nodes with `mi-browser navegadores` before asking Gabriel (persona:mi-browser-primero-y-nodo-con-sesion-20261019)."

language:
  policy_lang: English
  docs_lang: Spanish
  ux_orthography_rules:
    - "Preserve Spanish orthography and diacritics in documentation."

tracker:
  provider: None
  none:
    mode: local-only

secrets:
  vault: environment
  tool: environment variables

wrappers:
  - name: mi-lsp
    script: mi-lsp
    precondition: "Set MI_LSP_CLIENT_NAME and MI_LSP_SESSION_ID before governed navigation."
    authority: repository policy

wiki:
  layers_map:
    "00": Governance and terminal retirements (WIKI-CONTRACT-v1)
    "01": Scope
    "02": Outcomes
    "03": Architecture and ADR
    "04": Functional flows
    "05": Functional requirements and semantic data model
    "06": Test plans; RF-to-TP coverage is derived on demand
    "07": Technical baseline, physical data and contracts
    "10": UI journeys and modules; DESIGN.md and PRODUCT.md at repo root
    "ae": Compatibility history only; universal AE authority is the external Kernel v2 canon
  paths_file: PATHS.md
  subagents_file: AGENTS.md
  workspace_alias: mi-lsp
  decision_priority:
    functional_behavior:
      - RF
      - FL
      - data model
      - architecture
    data_state_contract:
      - data model
      - RF
      - FL
      - architecture
    operational_perf_infra:
      - architecture
      - FL
      - RF
      - data model

qa:
  canon_paths:
    - .docs/wiki/06_tests/

subagents:
  max_model: sonnet
  roster_file: AGENTS.md
  routing_notes:
    - "Use manifest-backed ae-adapter-* workers for governed T2+ work."
    - "Use read-only explorers for independent discovery axes."
