  kind = "ui"
  read_globs = ["internal/daemon/**"]
  edit_globs = ["internal/daemon/**"]

[[family]]
  name = "functional"
  intent_keywords = ["scope", "outcome", "result", "resultado", "solucion", "solution", "flow", "feature", "behavior", "rs", "rf", "fl", "test", "workflow", "governance"]
  paths = [".docs/wiki/00_governance.md", ".docs/wiki/00_retirements.md", ".docs/wiki/01_scope.md", ".docs/wiki/02_outcomes/RS-*.md", ".docs/wiki/03_architecture.md", ".docs/wiki/03_architecture/ADR-*.md", ".docs/wiki/04_flows/FL-*.md", ".docs/wiki/05_requirements/RF-*.md", ".docs/wiki/05_requirements/data-model.md", ".docs/wiki/05_requirements/data-model/DM-*.md", ".docs/wiki/06_tests/TP-*.md"]

[[family]]
  name = "technical"
  intent_keywords = ["technical", "governance", "runtime", "backend", "contract", "protocol", "search", "context", "refs", "service", "index", "routing", "ae", "agent engineering", "release", "distribution", "binary", "install"]
  paths = [".docs/wiki/07_technical.md", ".docs/wiki/07_technical/TECH-*.md", ".docs/wiki/07_technical/db/DB-*.md", ".docs/wiki/07_technical/contracts/CT-*.md"]

[[family]]
  name = "ux"
  intent_keywords = ["ux", "ui", "frontend", "visual", "design", "journey", "experience", "pattern", "interface", "governance"]
  paths = [".docs/wiki/10_ux/UJ-*.md", ".docs/wiki/10_ux/**/UJ-*.md", ".docs/wiki/10_ux/UXM-*.md", ".docs/wiki/10_ux/**/UXM-*.md", "DESIGN.md", "PRODUCT.md", "internal/daemon/**"]

[generic_docs]
  paths = ["README.md", "README*.md"]

[reading_pack]
  max_docs = 7
  functional_stage_order = ["governance", "scope", "outcome", "architecture", "decision", "flow", "requirement", "data_model", "test"]
  technical_stage_order = ["governance", "scope", "architecture", "technical", "database", "contract"]
  ux_stage_order = ["governance", "scope", "architecture", "journey", "ux_module", "design_md", "product_md", "ui"]

[governance]
  source_doc = ".docs/wiki/00_governance.md"
  source_format = "markdown+yaml"
  [governance.ae_canon]
    mode = "kernel_v2"
    source = "<kernel_home>/canon"
    repo_policy = ".docs/ae/repo-policy.yaml"
  [governance.projection]
    output = ".docs/wiki/_mi-lsp/read-model.toml"
    format = "toml"
    auto_sync = true
    versioned = true
[traits]
  [traits.exposes_api]
    reason = "Expone CLI, protocolo daemon/worker y endpoints admin locales consumidos por agentes y clientes."
  [traits.has_ui]
    reason = "Consola de gobernanza loopback del daemon para workspaces, runtimes y logs."
    ui_roots = ["internal/daemon/"]
  [traits.stores_data]
    reason = "Persiste catálogo, documentos, grafo y embeddings en SQLite repo-local, y estado/telemetría del daemon."
